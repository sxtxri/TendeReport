[project]
name = "tendereport"
version = "0.1.0"
description = ""
authors = [
    {name = "sxtxri",email = "dpetroof@yandex.ru"}
]
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "fastapi (>=0.142.2,<0.143.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "sqlalchemy (>=2.1.4,<3.0.0)",
    "watchfiles (>=1.3.0,<2.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "asgi-correlation-id (>=5.0.1,<6.0.0)",
    "greenlet (>=3.5.6,<4.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "structlog (>=26.1.0,<27.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-alembic (>=0.13.1,<0.14.0)",
    "yarl (>=1.25.1,<2.0.0)",
    "sqlalchemy-utils (>=0.43.0,<0.44.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "beautifulsoup4 (>=4.15.0,<5.0.0)",
    "lxml (>=6.1.0,<7.0.0)",
    "isort (>=9.0.2,<10.0.0)",
    "flake8 (>=7.4.1,<8.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]


[tool.isort]
profile = "black"
multi_line_output = 3

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.poetry.dependencies]
uvloop = { version = "^0.21", markers = "sys_platform != 'win32'" }
winloop = { version = "^0.2", markers = "sys_platform == 'win32'" }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
